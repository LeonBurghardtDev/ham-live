name: Image bauen

# Bei jedem Push auf main: Image bauen, kurz starten und prüfen, dann in die GitHub Container Registry schieben.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image-Namen bestimmen
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ham-live" >> "$GITHUB_ENV"

      - name: Image bauen
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      # Nur ein Image, das startet und /api/gesund beantwortet, wird veröffentlicht.
      - name: Image prüfen
        run: |
          set -eu
          docker run -d --name pruefung -e HAM_VORLADEN=aus "$IMAGE:${{ github.sha }}"
          ok=0
          for i in $(seq 1 20); do
            if docker exec pruefung wget -qO- http://127.0.0.1:8080/api/gesund | grep -q '"ok":true'; then ok=1; break; fi
            sleep 1
          done
          docker exec pruefung wget -qO- http://127.0.0.1:8080/ | grep -q '<title>HAM:LIVE' || ok=0
          docker logs pruefung | tail -5
          docker rm -f pruefung >/dev/null
          [ "$ok" = 1 ] || { echo "Image startet nicht oder antwortet nicht."; exit 1; }

      - name: An der Registry anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Image veröffentlichen
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
